name: Validate site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-metadata.mjs
      - run: npm run lint && npm run format:check && npm run check
      - run: npm run content:report
      - run: npm run preflight
      - run: npm run test:unit
      - run: npm run build
      - run: node scripts/test-pages-build.mjs
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'
      - run: npm run test:ads
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: browser-results
          path: |
            test-results/
            .cache/link-report.json
            .cache/visual/
          if-no-files-found: ignore
